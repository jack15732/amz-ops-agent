services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    environment:
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      AMZ_QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      AMZ_DATA_DIR: /app/data/runtime
      AMZ_AUTO_INGEST: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - qdrant

  ui:
    build: .
    command: ["streamlit", "run", "apps/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      AMZ_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  qdrant_data:
