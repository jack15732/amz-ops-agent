[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amz-ops-agent"
version = "0.2.0"
description = "Amazon cross-border listing pre-review agent: rule engine + hybrid RAG + tool-calling agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Liu Jinshan" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "qdrant-client>=1.10",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "jieba>=0.42",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.2"]
hf = ["sentence-transformers>=3.0"]
eval = ["datasets>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
amz-agent = "amz_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amz_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/amz_agent"]
